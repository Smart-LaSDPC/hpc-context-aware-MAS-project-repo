services:
  masproject-admin:
    image: masproject:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masproject-admin

    # =========================
    # Configuración (runtime)
    # =========================
    environment:
      # Healthcheck
      HEALTH_PORT: "8081"

      # MQTT configuration
      MQTT_BROKER_URL: "broker.hivemq.com:1883"
      MQTT_CLIENT_ID: "agent-masproject"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""

    # =========================
    # Exposición de puertos
    # =========================
    ports:
      - "8081:8081"

    # =========================
    # Control de ciclo de vida
    # =========================
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
